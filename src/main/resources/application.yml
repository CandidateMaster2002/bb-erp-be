spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: bb-erp-be
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bb_erp}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bb_erp}
    user: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${PORT:8080}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dummy_secret_for_local_development_only}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
