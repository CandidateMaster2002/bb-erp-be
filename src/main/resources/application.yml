spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: bb-erp-be
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bb_erp}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1800000
      keepalive-time: 120000
      connection-test-query: SELECT 1
      validation-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bb_erp}
    user: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${PORT:8080}

app:
  self-url: ${APP_SELF_URL:https://bb-erp-be.onrender.com}
  security:
    jwt:
      secret: ${JWT_SECRET:dummy_secret_for_local_development_only}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
